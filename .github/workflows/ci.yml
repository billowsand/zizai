# 两个 job：Linux 跑 fmt / clippy / 全 workspace 测试（Core 与协议层与平台无关，Linux 上能全跑）；
# Windows runner 编 Windows 壳与语音 Worker 并跑平台测试，平台特有的编译错在 PR 里就暴露，不等发版。
# 仓库公开，Actions 不计费。
# actions 一律钉到 commit（注释里是对应的标签），Dependabot 每周提 PR 更新；cargo 全加 --locked，Cargo.lock 没提交就报错。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  windows:
    runs-on: windows-latest
    env:
      # Server 的 build.rs 只在这个变量为 1 时嵌 uiAccess manifest（没签名的 exe 带它起不来，os error 740）。
      # 缺省就是关，这里写明是防有人误设成 1；与 release.yml 一致。
      QINGJIAN_UIACCESS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          components: clippy
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (Server, Voice, TSF DLL, Settings)
        run: cargo clippy -p qingjian-windows-server -p qingjian-windows-voice-worker -p qingjian-voice -p qingjian-windows-tsf -p qingjian-windows-settings --all-targets --locked -- -D warnings

      - name: Test (Server, Voice, TSF DLL, Settings)
        run: cargo test -p qingjian-windows-server -p qingjian-windows-voice-worker -p qingjian-voice -p qingjian-windows-tsf -p qingjian-windows-settings --locked

      # 安装包另带一份 32 位 DLL（企业微信 / WPS 这类 32 位应用只能加载它）
      - name: Check (TSF DLL, 32-bit)
        run: cargo check -p qingjian-windows-tsf --target i686-pc-windows-msvc --locked
