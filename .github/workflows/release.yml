# 推 windows-v<版本> 标签触发（Windows 壳版本号在 apps/windows/server/Cargo.toml），流程见 docs/notes/release.md。
# 代码签名走 SignPath Foundation 免费开源证书（docs/design/code-signing.md）：二进制构建后先送 SignPath 签回
# （Inno 原样打包已签文件），安装包编出后再签外层。签名请求要在 SignPath 面板由审批人手动批准
# （基金会条款：每次发布都批），action 挂起等待，批完自动继续。
# SignPath 没配齐（secrets.SIGNPATH_API_TOKEN + vars.SIGNPATH_PROJECT_SLUG）时退回旧行为：不签名、uiAccess=0。
# 发版后让官网重新构建（也可选）：
#   QINGJIAN_WEB_TOKEN           fine-grained PAT，对 qingjian-team/qingjian-web 有 Contents: read and write
#                                （官网由 Cloudflare 按仓库提交自动构建，tools/release/bump-website.sh 往那边推一个小提交）
#
# 门禁：版本号与标签一致且不带 -dev；标签指向的提交必须在 main 上（防止从没合并的分支或手滑的本地提交发版）。
# Secrets 不放 workflow 顶层 env，只注入真正用它的那一步；有没有配由第一步算成输出（secrets 不能直接写在 if 里）。
# actions 钉到 commit（注释是对应标签），Dependabot 每周更新；产品数据与本地整句模型从滚动的 data Release 下载，按它的 SHA256SUMS 校验并记进 build-info.json。
name: release

on:
  push:
    tags: ['windows-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    if: startsWith(github.ref_name, 'windows-v')
    runs-on: windows-latest
    permissions:
      contents: write
      # SignPath action 要用 GITHUB_TOKEN 读构建产物（artifact）与 job 元数据
      actions: read
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      # Windows 上 Python 的标准输出缺省 cp1252，中文更新日志会编码失败。
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          # 安装包另带一份 32 位 TSF DLL（build.ps1 编）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: |
          echo "website=${{ secrets.QINGJIAN_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          # SignPath 签名链：API token 与项目 slug 都配好才走签名，缺一退回无签名发版（同申请证书前的旧行为）。
          if [[ -n "${{ secrets.SIGNPATH_API_TOKEN }}" && -n "${{ vars.SIGNPATH_PROJECT_SLUG }}" ]]; then
            echo "signpath=true" >> "$GITHUB_OUTPUT"
          else
            echo "signpath=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version matches tag and tag is on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/windows/server/Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME#windows-v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/windows/server/Cargo.toml 是 $VERSION，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure build mode
        run: |
          # 签名链就绪（SignPath）时 Server 嵌 uiAccess：exe 会被签名且装进 Program Files，能升进 UIAccess
          # 高带，候选窗不再被商店 / 任务栏搜索盖住。没签名时必须保持 0（带 uiAccess 的未签名 exe 起不来，
          # os error 740）。这里不写死 job env，是因为有无签名要运行时按 secrets 判定。
          if [[ "${{ steps.secrets.outputs.signpath }}" == 'true' ]]; then
            echo "QINGJIAN_UIACCESS=1" >> "$GITHUB_ENV"
          else
            echo "QINGJIAN_UIACCESS=0" >> "$GITHUB_ENV"
          fi
          # SignPath 元数据校验要求同一次构建里所有产物的 ProductVersion 一致：所有 PE 都嵌这个版本
          # （各 crate 的 build.rs 读它，缺省回落 crate 版本）。
          echo "QINGJIAN_PRODUCT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/generated data/model
          gh release download data --pattern qingjian-data.tar.gz --pattern model.qjm --pattern SHA256SUMS --dir data
          (cd data && grep -E 'qingjian-data.tar.gz|model.qjm' SHA256SUMS | sha256sum -c -)
          echo "DATA_SHA256=$(sha256sum data/qingjian-data.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "MODEL_SHA256=$(sha256sum data/model.qjm | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar -xzf data/qingjian-data.tar.gz -C data/generated
          # 本地整句模型单文件：qingjian.iss 见到 data\model\model.qjm 就装进 {app}\data\model
          mv data/model.qjm data/model/
          ls -la data/generated data/generated/dicts data/model

      # sherpa-onnx-sys（语音 Worker 与 Server 间接依赖）的 build.rs 默认会从 GitHub release 下载预编译
      # Windows 静态库，但 release 构建常常因为 runner 上 swatinem/rust-cache 命中导致 build.rs 重跑时找不到
      # OUT_DIR 内的提取产物（`could not find native static library sherpa-onnx-c-api`，链接阶段报错）。
      # 在这步预先把 archive 拉到 target/ 下、解到固定路径，并把 SHERPA_ONNX_LIB_DIR 告诉 build.rs，
      # 让它直接用本地提取出的 lib，不再依赖自动下载。具体版本随 Cargo.lock 的 sherpa-onnx-sys 走，
      # 升 sherpa 时这一行也要跟着改。lock 文件改后强制回到这个版本。
      - name: Pre-fetch sherpa-onnx native lib
        shell: bash
        run: |
          SHERPA_VER=$(grep -A1 '^name = "sherpa-onnx-sys"' Cargo.lock | grep version | head -1 | sed -E 's/.*version = "(.*)"/\1/')
          if [[ -z "$SHERPA_VER" ]]; then
            echo "从 Cargo.lock 读不出 sherpa-onnx-sys 版本" >&2
            exit 1
          fi
          echo "sherpa-onnx-sys 版本：$SHERPA_VER"
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VER}/sherpa-onnx-v${SHERPA_VER}-win-x64-static-MT-Release-lib.tar.bz2"
          OUT_DIR="target/sherpa-onnx-prebuilt/sherpa-onnx-v${SHERPA_VER}-win-x64-static-MT-Release-lib"
          rm -rf target/sherpa-onnx-prebuilt
          mkdir -p "$OUT_DIR"
          curl.exe -L --fail --show-error --retry 5 --retry-delay 5 \
            -o "$OUT_DIR/../lib.tar.bz2" "$URL"
          cd "$OUT_DIR/.."
          tar -xjf "lib.tar.bz2"
          rm "lib.tar.bz2"
          ls "$OUT_DIR/lib" | head
          # 给后续 Build binaries step 用
          echo "SHERPA_ONNX_LIB_DIR=$(pwd)/${OUT_DIR##*/}/lib" >> "$GITHUB_ENV"

      - name: Build binaries
        shell: pwsh
        # -NoPackage：只构建。签回后再 -PackageOnly -PreSigned 打包，已签文件被 Inno 原样拷进安装包。
        # SHERPA_ONNX_LIB_DIR 由上游 Pre-fetch step 注入；build.rs 看这个变量就会跳过 GitHub 下载。
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1 -NoPackage

      # —— SignPath 签名第一段：TSF DLL 64/32 位、Server、语音 Worker、设置程序 ——
      # 关键的就是 TSF DLL：没签名的 DLL 在 UWP / 系统应用（任务栏搜索、「设置」）里被禁，签过才加载得进去。
      - name: Stage unsigned binaries
        if: steps.secrets.outputs.signpath == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signpath-input -Force | Out-Null
          # 两份 DLL 同名，32 位那个换名放进同一目录（artifact configuration 按这里的名录文件）。
          Copy-Item target\release\qingjian_tsf.dll signpath-input\qingjian_tsf.dll
          Copy-Item target\i686-pc-windows-msvc\release\qingjian_tsf.dll signpath-input\qingjian_tsf-x86.dll
          Copy-Item target\release\qingjian-server.exe signpath-input\qingjian-server.exe
          Copy-Item target\release\qingjian-voice-worker.exe signpath-input\qingjian-voice-worker.exe
          Copy-Item target\release\qingjian-settings-egui.exe signpath-input\qingjian-settings-egui.exe

      - name: Upload unsigned binaries
        if: steps.secrets.outputs.signpath == 'true'
        id: upload-binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-binaries
          path: signpath-input

      - name: Sign binaries (SignPath)
        if: steps.secrets.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_BINARIES }}
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          # release 签名策略要审批人在 SignPath 面板点批准；默认等 10 分钟不够，放宽到 2 小时。
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath-signed-binaries
          parameters: |
            version: "${{ env.VERSION }}"
        timeout-minutes: 130

      - name: Replace binaries with signed ones
        if: steps.secrets.outputs.signpath == 'true'
        shell: pwsh
        run: |
          # SignPath 签回的 artifact 是 zip（artifact configuration 根元素是 zip-file），解压后覆盖回 cargo 产物路径。
          $src = 'signpath-signed-binaries'
          $zip = Get-ChildItem $src -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
              Expand-Archive $zip.FullName "$src\extracted" -Force
              $src = "$src\extracted"
          }
          Copy-Item (Join-Path $src 'qingjian_tsf.dll') target\release\qingjian_tsf.dll
          Copy-Item (Join-Path $src 'qingjian_tsf-x86.dll') target\i686-pc-windows-msvc\release\qingjian_tsf.dll
          Copy-Item (Join-Path $src 'qingjian-server.exe') target\release\qingjian-server.exe
          Copy-Item (Join-Path $src 'qingjian-voice-worker.exe') target\release\qingjian-voice-worker.exe
          Copy-Item (Join-Path $src 'qingjian-settings-egui.exe') target\release\qingjian-settings-egui.exe

      # 与开发机同版本（7.1.0，自带简体中文翻译；Chocolatey 只有 6.x，6 的安装包不带简中）。钉死 GitHub Release 上的文件。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（2026-09-11 从上面地址下载后算出），对不上就不装。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Package installer
        shell: pwsh
        run: |
          # 签回产物打包带 -PreSigned（build.ps1 逐个校验签名有效才往下走）；无签名链时退回旧的剥签名行为。
          $isccArgs = @('-PackageOnly')
          if ('${{ steps.secrets.outputs.signpath }}' -eq 'true') { $isccArgs += '-PreSigned' }
          powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1 @isccArgs

      # —— SignPath 签名第二段：安装包外层 ——
      - name: Upload unsigned installer
        if: steps.secrets.outputs.signpath == 'true'
        id: upload-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installer
          path: target/installer/Zizai-*-Setup.exe

      - name: Sign installer (SignPath)
        if: steps.secrets.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_INSTALLER }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath-signed-installer
          parameters: |
            version: "${{ env.VERSION }}"
        timeout-minutes: 130

      - name: Replace installer with signed one
        if: steps.secrets.outputs.signpath == 'true'
        shell: pwsh
        run: |
          $src = 'signpath-signed-installer'
          $zip = Get-ChildItem $src -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
              Expand-Archive $zip.FullName "$src\extracted" -Force
              $src = "$src\extracted"
          }
          $signed = Get-ChildItem $src -Recurse -Filter 'Zizai-*-Setup.exe' | Select-Object -First 1
          if (-not $signed) { throw '签回的安装包没找到' }
          Remove-Item target\installer\Zizai-*-Setup.exe
          Copy-Item $signed.FullName target\installer\

      - name: Checksums and build info
        run: |
          cd target/installer
          sha256sum ./*.exe | tee SHA256SUMS
          RUNNER_OS_NAME="$(powershell -NoProfile -Command '(Get-CimInstance Win32_OperatingSystem).Caption' | tr -d '\r')"
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "$RUNNER_OS_NAME" --arg data_sha256 "$DATA_SHA256" --arg model_sha256 "$MODEL_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_sha256: $data_sha256, model_sha256: $model_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [[ "${{ steps.secrets.outputs.signpath }}" == 'true' ]]; then
            printf '\n> 本版已由 SignPath Foundation 的证书签名（发布者显示 SignPath Foundation）：TSF DLL 签名后可在任务栏搜索、「设置」等系统应用里正常输入；Server 带 uiAccess，候选窗不再被这些界面遮挡。SmartScreen 信誉随版本积累，首次安装若仍提示请点「更多信息 → 仍要运行」。\n' >> "$RUNNER_TEMP/notes.md"
          else
            printf '\n> 内测版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" --title "字在 Windows $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            target/installer/*.exe target/installer/SHA256SUMS target/installer/build-info.json

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" target/installer

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh
