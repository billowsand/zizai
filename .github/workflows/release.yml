# 推 windows-v<版本> 标签触发（Windows 壳版本号在 apps/windows/server/Cargo.toml），流程见 docs/notes/release.md。
# 代码签名走 SignPath Foundation 免费开源证书（docs/design/code-signing.md）：二进制构建后先送 SignPath 签回
# （Inno 原样打包已签文件），安装包编出后再签外层。签名请求要在 SignPath 面板由审批人手动批准
# （基金会条款：每次发布都批），action 挂起等待，批完自动继续。
# SignPath 没配齐（secrets.SIGNPATH_API_TOKEN + vars.SIGNPATH_PROJECT_SLUG）时退回旧行为：不签名、uiAccess=0。
# 发版后让官网重新构建（也可选）：
#   QINGJIAN_WEB_TOKEN           fine-grained PAT，对 qingjian-team/qingjian-web 有 Contents: read and write
#                                （官网由 Cloudflare 按仓库提交自动构建，tools/release/bump-website.sh 往那边推一个小提交）
#
# 门禁：版本号与标签一致且不带 -dev；标签指向的提交必须在 main 上（防止从没合并的分支或手滑的本地提交发版）。
# Secrets 不放 workflow 顶层 env，只注入真正用它的那一步；有没有配由第一步算成输出（secrets 不能直接写在 if 里）。
# actions 钉到 commit（注释是对应标签），Dependabot 每周更新；产品数据与本地整句模型从滚动的 data Release 下载，按它的 SHA256SUMS 校验并记进 build-info.json。
name: release

on:
  push:
    tags: ['windows-v*', 'windows-v*-bundled']

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    if: startsWith(github.ref_name, 'windows-v')
    runs-on: windows-latest
    permissions:
      contents: write
      # SignPath action 要用 GITHUB_TOKEN 读构建产物（artifact）与 job 元数据
      actions: read
    defaults:
      run:
        shell: bash
    env:
      PYTHON: python
      # Windows 上 Python 的标准输出缺省 cp1252，中文更新日志会编码失败。
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          # 安装包另带一份 32 位 TSF DLL（build.ps1 编）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: |
          echo "website=${{ secrets.QINGJIAN_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
          # SignPath 签名链：API token 与项目 slug 都配好才走签名，缺一退回无签名发版（同申请证书前的旧行为）。
          if [[ -n "${{ secrets.SIGNPATH_API_TOKEN }}" && -n "${{ vars.SIGNPATH_PROJECT_SLUG }}" ]]; then
            echo "signpath=true" >> "$GITHUB_OUTPUT"
          else
            echo "signpath=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version matches tag and tag is on main
        run: |
          set +e
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/windows/server/Cargo.toml | head -1)"
          # tag push 触发时 GITHUB_REF 在不同 runner 上 form 不一致（有 refs/tags/ 也有仅名字），取 basename。
          TAG_REF_NAME="${GITHUB_REF##*/}"
          TAG="${TAG_REF_NAME#windows-v}"
          # bundled 变体：windows-v<version>-bundled 指向同一份已发版 commit。
          BUNDLED="0"
          if [ "${TAG_REF_NAME%-bundled}" != "$TAG_REF_NAME" ]; then
            TAG="${TAG%-bundled}"
            BUNDLED="1"
          fi
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/windows/server/Cargo.toml 是 $VERSION，标签是 $TAG_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$BUNDLED" == "1" ]]; then
            # bundled 变体：tag 故意指向历史已发版 commit，不必在 main 上。
            echo "bundled 变体：跳过 main 祖先检查（$GITHUB_SHA 不必在 origin/main 上）"
          else
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "标签 $TAG_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
              exit 1
            fi
          fi
          set -e
          # 写 env 给后续 step（GitHub Actions 会在 step 退出后处理 GITHUB_ENV 文件）
          if [[ "$BUNDLED" == "1" ]]; then
            echo "BUNDLED=1" >> "$GITHUB_ENV"
            echo "BASE_TAG=windows-v$TAG" >> "$GITHUB_ENV"
            echo "allow_history_tag=1" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure build mode
        run: |
          # 签名链就绪（SignPath）时 Server 嵌 uiAccess：exe 会被签名且装进 Program Files，能升进 UIAccess
          # 高带，候选窗不再被商店 / 任务栏搜索盖住。没签名时必须保持 0（带 uiAccess 的未签名 exe 起不来，
          # os error 740）。这里不写死 job env，是因为有无签名要运行时按 secrets 判定。
          if [[ "${{ steps.secrets.outputs.signpath }}" == 'true' ]]; then
            echo "QINGJIAN_UIACCESS=1" >> "$GITHUB_ENV"
          else
            echo "QINGJIAN_UIACCESS=0" >> "$GITHUB_ENV"
          fi
          # SignPath 元数据校验要求同一次构建里所有产物的 ProductVersion 一致：所有 PE 都嵌这个版本
          # （各 crate 的 build.rs 读它，缺省回落 crate 版本）。
          echo "QINGJIAN_PRODUCT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/generated data/model
          gh release download data --pattern qingjian-data.tar.gz --pattern model.qjm --pattern SHA256SUMS --dir data
          (cd data && grep -E 'qingjian-data.tar.gz|model.qjm' SHA256SUMS | sha256sum -c -)
          echo "DATA_SHA256=$(sha256sum data/qingjian-data.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "MODEL_SHA256=$(sha256sum data/model.qjm | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar -xzf data/qingjian-data.tar.gz -C data/generated
          # 本地整句模型单文件：qingjian.iss 见到 data\model\model.qjm 就装进 {app}\data\model
          mv data/model.qjm data/model/
          ls -la data/generated data/generated/dicts data/model

      # sherpa-onnx-sys（语音 Worker 与 Server 间接依赖）的 build.rs 默认会从 GitHub release 下载预编译
      # Windows 静态库，但 release 构建常常因为 runner 上 swatinem/rust-cache 命中导致 build.rs 重跑时找不到
      # OUT_DIR 内的提取产物（`could not find native static library sherpa-onnx-c-api`，链接阶段报错）。
      # 在这步预先把 archive 拉到 target/ 下、解到固定路径，并把 SHERPA_ONNX_LIB_DIR 告诉 build.rs，
      # 让它直接用本地提取出的 lib，不再依赖自动下载。具体版本随 Cargo.lock 的 sherpa-onnx-sys 走，
      # 升 sherpa 时这一行也要跟着改。lock 文件改后强制回到这个版本。
      # 用 PowerShell（自带 bsdtar，支持 bz2），避开 shell 路径错位。
      - name: Pre-fetch sherpa-onnx native lib
        shell: pwsh
        run: |
          $content = Get-Content Cargo.lock -Raw
          if ($content -match '(?ms)^name\s*=\s*"sherpa-onnx-sys"\s*\nversion\s*=\s*"([^"]+)"') {
            $SHERPA_VER = $Matches[1]
          } else {
            Write-Error "从 Cargo.lock 读不出 sherpa-onnx-sys 版本"
            exit 1
          }
          Write-Host "sherpa-onnx-sys 版本：$SHERPA_VER"
          $URL = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VER}/sherpa-onnx-v${SHERPA_VER}-win-x64-static-MT-Release-lib.tar.bz2"
          $Root = "target/sherpa-onnx-prebuilt"
          $Extracted = Join-Path $Root "sherpa-onnx-v${SHERPA_VER}-win-x64-static-MT-Release-lib"
          if (Test-Path $Root) { Remove-Item -Recurse -Force $Root }
          New-Item -ItemType Directory -Path $Root | Out-Null
          $bz2 = Join-Path $Root "lib.tar.bz2"
          Invoke-WebRequest -Uri $URL -OutFile $bz2
          # pwsh 自带 bsdtar 处理 .tar.bz2；archive 由 GitHub release tag v<ver> 锁定。
          tar -xjf $bz2 -C $Root
          Remove-Item $bz2
          $LibFile = Join-Path $Extracted 'lib/sherpa-onnx-c-api.lib'
          if (-not (Test-Path $LibFile)) {
            Write-Error "提取后没找到 $LibFile"
            Get-ChildItem -Recurse $Root | Select-Object FullName -First 30
            exit 1
          }
          Get-ChildItem (Join-Path $Extracted 'lib') | Select-Object Name -First 10
          # 给后续 Build binaries step 用：写绝对路径，pwsh 的 tar 路径不带反斜杠奇异
          "SHERPA_ONNX_LIB_DIR=$((Resolve-Path (Join-Path $Extracted 'lib')).Path)" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # bundled 变体：把 SenseVoice / 标点恢复 / 同音词替换三个第三方模型拉到本地目录，
      # 让 build.ps1 用 -VoiceModelDir / -PunctuationModelDir / -HrDir 打进安装包。
      # 仅当 BUNDLED=1 时跑；非 bundled tag 这几个 step 跳空。
      # URL 与 SHA-256 由维护者手工核实后固化——sherpa-onnx 不重发 GitHub release tag。
      - name: Pre-fetch bundled models (SenseVoice / punctuation / hr)
        if: env.BUNDLED == '1'
        shell: pwsh
        run: |
          $RepoRoot = $env:GITHUB_WORKSPACE
          if (-not $RepoRoot) { throw '$env:GITHUB_WORKSPACE 未设置' }
          $BundledDir = Join-Path $RepoRoot 'target/bundled-models'
          if (Test-Path $BundledDir) { Remove-Item -Recurse -Force $BundledDir }
          New-Item -ItemType Directory -Path (Join-Path $BundledDir 'sense-voice') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $BundledDir 'punctuation') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $BundledDir 'hr') -Force | Out-Null

          # 1) SenseVoice（int8）：sherpa-onnx 官方 release v<ver>，与 sherpa-onnx-sys 锁同一个版本。
          $SHERPA_VER = '1.13.8'
          $SvUrl = "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
          $SvTar = Join-Path $BundledDir 'sense-voice/sv.tar.bz2'
          Invoke-WebRequest -Uri $SvUrl -OutFile $SvTar
          $SvSha = (Get-FileHash -Path $SvTar -Algorithm SHA256).Hash.ToLowerInvariant()
          $SvExpected = '7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e'
          if ($SvSha -ne $SvExpected) {
            throw "SenseVoice archive SHA-256 不符：$SvSha（期望 $SvExpected）。换模型时来这里改。"
          }
          tar -xjf $SvTar -C (Join-Path $BundledDir 'sense-voice')
          Remove-Item $SvTar
          # tar 出来后子目录名通常是 sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/，按内容向下探一层
          $svInner = Get-ChildItem (Join-Path $BundledDir 'sense-voice') -Directory | Select-Object -First 1
          if ($svInner) {
            Get-ChildItem $svInner.FullName | ForEach-Object { Move-Item -Path $_.FullName -Destination (Join-Path $BundledDir 'sense-voice') -Force }
            Remove-Item $svInner.FullName -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $BundledDir 'sense-voice/model.int8.onnx'))) { throw 'SenseVoice model.int8.onnx 未落地' }
          if (-not (Test-Path (Join-Path $BundledDir 'sense-voice/tokens.txt'))) { throw 'SenseVoice tokens.txt 未落地' }
          Write-Host "SenseVoice OK"

          # 2) 标点恢复：sherpa-onnx punctuation-models tag，文件名见 crate-notes 与 build.ps1 注释
          $PunctUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/punctuation-models/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12-int8.tar.bz2'
          $PunctTar = Join-Path $BundledDir 'punctuation/punct.tar.bz2'
          Invoke-WebRequest -Uri $PunctUrl -OutFile $PunctTar
          $PunctSha = (Get-FileHash -Path $PunctTar -Algorithm SHA256).Hash.ToLowerInvariant()
          $PunctExpected = 'c0d5aa5f8eeb686032345e180bedf39319dc2e0556781c6264bcadba8328a6e1'
          if ($PunctSha -ne $PunctExpected) {
            throw "punctuation archive SHA-256 不符：$PunctSha（期望 $PunctExpected）。换模型时来这里改。"
          }
          tar -xjf $PunctTar -C (Join-Path $BundledDir 'punctuation')
          Remove-Item $PunctTar
          $punctInner = Get-ChildItem (Join-Path $BundledDir 'punctuation') -Directory | Select-Object -First 1
          if ($punctInner) {
            Get-ChildItem $punctInner.FullName | ForEach-Object { Move-Item -Path $_.FullName -Destination (Join-Path $BundledDir 'punctuation') -Force }
            Remove-Item $punctInner.FullName -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $BundledDir 'punctuation/model.int8.onnx'))) { throw 'punctuation model.int8.onnx 未落地' }
          Write-Host "punctuation OK"

          # 3) 同音词 FST 与 lexicon：同包，sherpa-onnx 仓库上传两份小文件
          $HrLexUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/hr-files/lexicon.txt'
          $HrFstUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/hr-files/replace.fst'
          $HrLexTgt = Join-Path $BundledDir 'hr/lexicon.txt'
          $HrFstTgt = Join-Path $BundledDir 'hr/replace.fst'
          Invoke-WebRequest -Uri $HrLexUrl -OutFile $HrLexTgt
          Invoke-WebRequest -Uri $HrFstUrl -OutFile $HrFstTgt
          $HrLexSha = (Get-FileHash -Path $HrLexTgt -Algorithm SHA256).Hash.ToLowerInvariant()
          $HrFstSha = (Get-FileHash -Path $HrFstTgt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($HrLexSha -ne '978900e511bc481b8630cb6e4a573c12566fa092c366d5396e2c3823dec9dcb9') {
            throw "hr/lexicon.txt SHA-256 不符：$HrLexSha。hr-files release 出新版时改这里。"
          }
          if ($HrFstSha -ne '6316a8496edf222191fd768ef08e420230097ec5076f2a2665f7d07e17051896') {
            throw "hr/replace.fst SHA-256 不符：$HrFstSha。"
          }
          Write-Host "hr OK"

          # 4) 给后续 step 写指向三个目录的环境变量
          "BUNDLED_VOICE_DIR=$((Resolve-Path (Join-Path $BundledDir 'sense-voice')).Path)" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLED_PUNCT_DIR=$((Resolve-Path (Join-Path $BundledDir 'punctuation')).Path)" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUNDLED_HR_DIR=$((Resolve-Path (Join-Path $BundledDir 'hr')).Path)" `
            | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build binaries
        shell: pwsh
        # -NoPackage：只构建。签回后再 -PackageOnly -PreSigned 打包，已签文件被 Inno 原样拷进安装包。
        # SHERPA_ONNX_LIB_DIR 由上游 Pre-fetch step 注入；build.rs 看这个变量就会跳过 GitHub 下载。
        # bundled 变体：传 -VoiceModelDir / -PunctuationModelDir / -HrDir / -BuildLabel bundled，让 build.ps1 把模型打进包。
        run: |
          $args = @('-NoPackage')
          if ($env:BUNDLED_VOICE_DIR) { $args += @('-VoiceModelDir', $env:BUNDLED_VOICE_DIR) }
          if ($env:BUNDLED_PUNCT_DIR) { $args += @('-PunctuationModelDir', $env:BUNDLED_PUNCT_DIR) }
          if ($env:BUNDLED_HR_DIR)    { $args += @('-HrDir', $env:BUNDLED_HR_DIR) }
          if ($env:BUNDLED -eq '1')   { $args += '-BuildLabel', 'bundled' }
          powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1 @args

      # —— SignPath 签名第一段：TSF DLL 64/32 位、Server、语音 Worker、设置程序 ——
      # 关键的就是 TSF DLL：没签名的 DLL 在 UWP / 系统应用（任务栏搜索、「设置」）里被禁，签过才加载得进去。
      - name: Stage unsigned binaries
        if: steps.secrets.outputs.signpath == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signpath-input -Force | Out-Null
          # 两份 DLL 同名，32 位那个换名放进同一目录（artifact configuration 按这里的名录文件）。
          Copy-Item target\release\qingjian_tsf.dll signpath-input\qingjian_tsf.dll
          Copy-Item target\i686-pc-windows-msvc\release\qingjian_tsf.dll signpath-input\qingjian_tsf-x86.dll
          Copy-Item target\release\qingjian-server.exe signpath-input\qingjian-server.exe
          Copy-Item target\release\qingjian-voice-worker.exe signpath-input\qingjian-voice-worker.exe
          Copy-Item target\release\qingjian-settings-egui.exe signpath-input\qingjian-settings-egui.exe

      - name: Upload unsigned binaries
        if: steps.secrets.outputs.signpath == 'true'
        id: upload-binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-binaries
          path: signpath-input

      - name: Sign binaries (SignPath)
        if: steps.secrets.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_BINARIES }}
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          # release 签名策略要审批人在 SignPath 面板点批准；默认等 10 分钟不够，放宽到 2 小时。
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath-signed-binaries
          parameters: |
            version: "${{ env.VERSION }}"
        timeout-minutes: 130

      - name: Replace binaries with signed ones
        if: steps.secrets.outputs.signpath == 'true'
        shell: pwsh
        run: |
          # SignPath 签回的 artifact 是 zip（artifact configuration 根元素是 zip-file），解压后覆盖回 cargo 产物路径。
          $src = 'signpath-signed-binaries'
          $zip = Get-ChildItem $src -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
              Expand-Archive $zip.FullName "$src\extracted" -Force
              $src = "$src\extracted"
          }
          Copy-Item (Join-Path $src 'qingjian_tsf.dll') target\release\qingjian_tsf.dll
          Copy-Item (Join-Path $src 'qingjian_tsf-x86.dll') target\i686-pc-windows-msvc\release\qingjian_tsf.dll
          Copy-Item (Join-Path $src 'qingjian-server.exe') target\release\qingjian-server.exe
          Copy-Item (Join-Path $src 'qingjian-voice-worker.exe') target\release\qingjian-voice-worker.exe
          Copy-Item (Join-Path $src 'qingjian-settings-egui.exe') target\release\qingjian-settings-egui.exe

      # 与开发机同版本（7.1.0，自带简体中文翻译；Chocolatey 只有 6.x，6 的安装包不带简中）。钉死 GitHub Release 上的文件。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（2026-09-11 从上面地址下载后算出），对不上就不装。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Package installer
        shell: pwsh
        run: |
          # 签回产物打包带 -PreSigned（build.ps1 逐个校验签名有效才往下走）；无签名链时退回旧的剥签名行为。
          $isccArgs = @('-PackageOnly')
          if ('${{ steps.secrets.outputs.signpath }}' -eq 'true') { $isccArgs += '-PreSigned' }
          if ($env:BUNDLED_VOICE_DIR) { $isccArgs += @('-VoiceModelDir', $env:BUNDLED_VOICE_DIR) }
          if ($env:BUNDLED_PUNCT_DIR) { $isccArgs += @('-PunctuationModelDir', $env:BUNDLED_PUNCT_DIR) }
          if ($env:BUNDLED_HR_DIR)    { $isccArgs += @('-HrDir', $env:BUNDLED_HR_DIR) }
          if ($env:BUNDLED -eq '1')   { $isccArgs += '-BuildLabel', 'bundled' }
          powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1 @isccArgs

      # —— SignPath 签名第二段：安装包外层 ——
      - name: Upload unsigned installer
        if: steps.secrets.outputs.signpath == 'true'
        id: upload-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installer
          path: target/installer/Zizai-*-Setup.exe

      - name: Sign installer (SignPath)
        if: steps.secrets.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_INSTALLER }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signpath-signed-installer
          parameters: |
            version: "${{ env.VERSION }}"
        timeout-minutes: 130

      - name: Replace installer with signed one
        if: steps.secrets.outputs.signpath == 'true'
        shell: pwsh
        run: |
          $src = 'signpath-signed-installer'
          $zip = Get-ChildItem $src -Recurse -Filter *.zip | Select-Object -First 1
          if ($zip) {
              Expand-Archive $zip.FullName "$src\extracted" -Force
              $src = "$src\extracted"
          }
          $signed = Get-ChildItem $src -Recurse -Filter 'Zizai-*-Setup.exe' | Select-Object -First 1
          if (-not $signed) { throw '签回的安装包没找到' }
          Remove-Item target\installer\Zizai-*-Setup.exe
          Copy-Item $signed.FullName target\installer\

      - name: Checksums and build info
        run: |
          cd target/installer
          sha256sum ./*.exe | tee SHA256SUMS
          RUNNER_OS_NAME="$(powershell -NoProfile -Command '(Get-CimInstance Win32_OperatingSystem).Caption' | tr -d '\r')"
          jq -n --arg version "$VERSION" --arg tag "${BASE_TAG:-$GITHUB_REF_NAME}" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "$RUNNER_OS_NAME" --arg data_sha256 "$DATA_SHA256" --arg model_sha256 "$MODEL_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_sha256: $data_sha256, model_sha256: $model_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [[ "${{ steps.secrets.outputs.signpath }}" == 'true' ]]; then
            printf '\n> 本版已由 SignPath Foundation 的证书签名（发布者显示 SignPath Foundation）：TSF DLL 签名后可在任务栏搜索、「设置」等系统应用里正常输入；Server 带 uiAccess，候选窗不再被这些界面遮挡。SmartScreen 信誉随版本积累，首次安装若仍提示请点「更多信息 → 仍要运行」。\n' >> "$RUNNER_TEMP/notes.md"
          else
            printf '\n> 内测版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。\n' >> "$RUNNER_TEMP/notes.md"
          fi
          # bundled 变体：把 asset 追加到 BASE_TAG 上的 release（标准 windows-v0.1.11 那条），不创建新 release。
          # sha256SUMS + build-info.json 同时也只放一份，按标准 release 算；bundled 这次只追加 .exe。
          if [[ "${BUNDLED:-0}" == '1' ]]; then
            TARGET_TAG="$BASE_TAG"
            # 让 release notes 里多一段「本安装包含本地模型」说明
            printf '\n\n## 本安装包含本地模型\n\n- SenseVoice（int8，约 215 MB）：语音识别核心。许可参见 sherpa-onnx 项目（Apache-2.0）。\n- 标点恢复 CT-Transformer（约 75 MB）：识别后自动加标点。许可见 k2-fsa/sherpa-onnx（Apache-2.0）。\n- 同音词替换 FST + lexicon（约 1.4 MB）：识别结果里的同音词替换。许可见 k2-fsa/sherpa-onnx（Apache-2.0）。\n- 本地整句模型 model.qjm（约 56 MB）：服务器侧整句重排。许可见训练仓库导出声明。\n\n装机到另一台机器就不需要联网下模型，第一次启用语音即可用。安装包比标准版大约 +270 MB。\n' >> "$RUNNER_TEMP/notes.md"
            # 把追加的公告段写到一个临时文件供后续 notes 用：append 到既有 notes 不行（gh release upload --notes
            # 是覆盖整个 release notes；这里只追加一次，发布后由维护者手工往下写）。
            tmp="$(mktemp -d)"
            echo "$RUNNER_TEMP/notes.md" > "$tmp/orig"
          else
            TARGET_TAG="$GITHUB_REF_NAME"
          fi
          if [[ "${BUNDLED:-0}" == '1' ]]; then
            # bundled：只追加 asset 到既有 release。
            gh release upload "$TARGET_TAG" --clobber target/installer/Zizai-*-bundled-Setup.exe
          else
            # 标准：新建 release。
            gh release create "$TARGET_TAG" --title "字在 Windows $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
              target/installer/*.exe target/installer/SHA256SUMS target/installer/build-info.json
          fi

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # bundled 变体的 asset 已追加到 BASE_TAG 上的 release；releases.json 也按 BASE_TAG 重生成，
          # 这样官网 latest 仍然指向标准包的版本号，新增的 bundled asset 出现在该条 release 的 assets 里。
          if [[ "${BUNDLED:-0}" == '1' ]]; then
            EFFECTIVE_TAG="$BASE_TAG"
          else
            EFFECTIVE_TAG="$GITHUB_REF_NAME"
          fi
          tools/release/publish-releases-json.sh "$EFFECTIVE_TAG" target/installer

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          QINGJIAN_WEB_TOKEN: ${{ secrets.QINGJIAN_WEB_TOKEN }}
        run: tools/release/bump-website.sh
