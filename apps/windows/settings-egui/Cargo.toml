[package]
name = "qingjian-windows-settings-egui"
description = "字在 Windows 的默认设置界面：egui 左侧导航与紧凑设置列表"
version = "0.1.10"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "qingjian-settings-egui"
path = "src/main.rs"

[features]
# 控制台子系统：量首帧耗时与 wgpu 适配器时用（缺省 GUI 子系统，双击不弹黑窗）
console = []

[dependencies]
qingjian-platform.workspace = true
toml_edit.workspace = true

# UI 本体只在 Windows 编，与 apps/windows/settings 一致
[target."cfg(windows)".dependencies]
# wgpu 后端（D3D12，无独显时能退 WARP 软件适配器）+ accesskit（UIA 无障碍树）；
# default_fonts 只为拿它的符号与 emoji 字体，中文字体在 fonts.rs 里从系统装
eframe = { version = "0.33", default-features = false, features = [
    "wgpu",
    "accesskit",
    "default_fonts",
] }
# eframe 不替你选 wgpu 的后端：不开这个 feature 运行时直接 panic「No wgpu backend feature…」。
# 只开 dx12：Win10 1809+ 都有，没有可用 GPU 时能退 WARP 软件适配器（Vulkan 得看驱动装没装，不指望）。
wgpu = { version = "27.0", default-features = false, features = ["dx12"] }
# 复用它的 system_fonts（DirectWrite 按字族名找字体文件）与候选窗配色 Palette
qingjian-render.workspace = true
# 词库页要读 .qj 的名称 / 词条数 / 许可证；关于页的输入统计要 Usage / book_scale
qingjian-core.workspace = true
qingjian-learning.workspace = true
jiff.workspace = true
rfd = "0.17"
# 读 AppsUseLightTheme 跟随系统明暗（Server 判断候选窗深浅用的也是它）
windows-registry.workspace = true
# 在语音设置里列出 WASAPI 输入设备；识别 Worker 仍独占实际采音。
cpal = "0.15"
# 解 Logo 的 PNG（渲染器也用它），省得为一张图引 egui_extras 的图片加载器
png.workspace = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true
