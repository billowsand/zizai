[package]
name = "qingjian-windows-tsf"
description = "Windows 输入法的 TSF 文本服务 DLL：加载进每个应用进程，把系统按键经 IPC 交给 Server 进程（../server）"
version = "0.1.11"
edition.workspace = true
license.workspace = true
repository.workspace = true

# cdylib 是产物 qingjian_tsf.dll（regsvr32 与安装脚本都认这个名字）；rlib 给端到端协议测试 `use qingjian_tsf`。
[lib]
name = "qingjian_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
qingjian-core.workspace = true
qingjian-platform.workspace = true
thiserror.workspace = true

[dev-dependencies]
qingjian-windows-server = { path = "../server" }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-registry.workspace = true
# `#[implement]` 宏展开引用 `::windows_core`，要直接依赖
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # CreateMutexW 带 SECURITY_ATTRIBUTES，要这个才编得出来（拉起 Server 时跨进程去重用）
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    # ProcessIdToSessionId：按会话号连本会话的 Server
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# build.rs 嵌 VERSIONINFO（产品名/版本），SignPath 签名元数据校验要（见 build.rs 头注释）
winresource = "0.1.31"
